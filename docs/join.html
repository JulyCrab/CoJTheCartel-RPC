<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call of Juarez: The Cartel RPC Join</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    box-sizing: border-box;
    background: #e8e8ed;
    color: #3a3a3c;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-align: center;
}

h1 {
    margin: 0 0 12px;
    font-size: 48px;
    font-weight: 600;
}

p {
    margin: 0;
    font-size: 19px;
    color: #7c7c80;
}

.game {
    margin-bottom: 10px;
    font-size: 17px;
    font-weight: 600;
    color: #b8622f;
}

@media (prefers-color-scheme: dark) {
    body {
        background: #1c1c1e;
        color: #d8d8dc;
    }

    p {
        color: #8e8e93;
    }

    .game {
        color: #d07a45;
    }
}

@media (max-width: 500px) {
    h1 {
        font-size: 32px;
    }
}
</style>
</head>
<body>
<div id="error" hidden role="alert" aria-hidden="true" tabindex="-1">
    <p class="game">Call of Juarez: The Cartel</p>
    <h1>This join link isn't valid.</h1>
    <p>It may have expired. Ask your friend to share a new one.</p>
</div>
<script>
const params = new URLSearchParams(location.search);
const lobby = params.get("lobby");
const id = params.get("id");
const isNumber = value => /^\d{1,20}$/.test(value);

if (isNumber(lobby) && (!id || isNumber(id))) {
    location.replace(`steam://joinlobby/33420/${lobby}` + (id ? `/${id}` : ""));
} else {
    const err = document.getElementById("error");
    err.hidden = false;
    err.setAttribute("aria-hidden", "false");
    err.focus();
}
</script>
</body>
</html>

name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2
    
    - name: Build
      run: msbuild CartelRichPresence.sln /p:Configuration=Release /p:Platform=x86 /v:minimal
    
    - name: Upload build
      uses: actions/upload-artifact@v4
      with:
        name: CartelRichPresence
        path: bin/Release/CartelRichPresence.asi
    
    - name: Attach to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: bin/Release/CartelRichPresence.asi
